name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.0'
          channel: stable
          cache: true

      - name: 依赖
        run: flutter pub get

      - name: 格式检查
        run: dart format --output=none --set-exit-if-changed lib test tool

      - name: 静态检查
        run: flutter analyze

      # golden 依赖渲染平台，跳过；其余测试不依赖 Android SDK
      - name: 单元与组件测试
        run: flutter test --exclude-tags golden
